<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kbo_fans">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kbo_fans</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0F0F0F;
      color: #FFFFFF;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body {
      overflow: hidden;
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F0F0F;
      z-index: 9999;
      transition: opacity 240ms ease;
    }
    #boot-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #boot-splash .inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #boot-splash .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }
    #boot-splash .subtitle {
      font-size: 13px;
      color: #B0B0B0;
    }
    #boot-splash .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2.6px solid rgba(255, 68, 68, 0.22);
      border-top-color: #FF4444;
      animation: boot-spin 0.9s linear infinite;
    }
    @keyframes boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="inner">
      <div class="title">KBO Fans</div>
      <div class="subtitle">야구 정보를 준비하는 중입니다</div>
      <div class="spinner"></div>
    </div>
  </div>
  <script>
    (function normalizeHashRoute() {
      var hash = window.location.hash || '';
      if (hash.indexOf('#/') !== 0) return;
      var target = hash.substring(1);
      if (!target || target === '/boot') target = '/home';
      window.history.replaceState(null, '', target);
    })();

    function removeBootSplash() {
      var splash = document.getElementById('boot-splash');
      if (!splash || splash.classList.contains('is-hidden')) return;
      splash.classList.add('is-hidden');
      window.setTimeout(function () {
        if (splash && splash.parentNode) {
          splash.parentNode.removeChild(splash);
        }
      }, 260);
    }

    window.addEventListener('flutter-first-frame', removeBootSplash);

    var splashObserver = window.setInterval(function () {
      var flutterView =
        document.querySelector('flt-glass-pane') ||
        document.querySelector('flutter-view') ||
        document.querySelector('[flt-renderer]');
      if (flutterView) {
        window.clearInterval(splashObserver);
        removeBootSplash();
      }
    }, 300);

    window.setTimeout(function () {
      window.clearInterval(splashObserver);
      removeBootSplash();
    }, 6000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
