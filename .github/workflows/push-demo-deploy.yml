name: Push Demo Deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate scripts without AWS/Docker deploy calls
        required: true
        default: true
        type: boolean
      image_tag:
        description: Backend image tag to build and deploy
        required: true
        default: latest
        type: string
      skip_readiness:
        description: Skip readiness check after deploy
        required: true
        default: false
        type: boolean
      resubscribe_topics:
        description: Reconcile registered FCM topics from the push registry after deploy
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: push-demo-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-northeast-2' }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_ACCESS_KEY_ID_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
      IOS_GOOGLE_SERVICE_INFO_PLIST_SECRET: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
      ANDROID_GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
      FIREBASE_SERVICE_ACCOUNT_JSON_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      APNS_AUTH_KEY_P8_SECRET: ${{ secrets.APNS_AUTH_KEY_P8 }}
      KBO_RELAY_USER_ID_SECRET: ${{ secrets.KBO_RELAY_USER_ID }}
      KBO_RELAY_PASSWORD_SECRET: ${{ secrets.KBO_RELAY_PASSWORD }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID || secrets.APNS_KEY_ID }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID || secrets.APNS_TEAM_ID }}
      APNS_BUNDLE_ID: com.kbofans.kboFans
      APNS_USE_SANDBOX: "false"
      PUSH_SYNC_SECRET_INPUT: ${{ secrets.PUSH_SYNC_SECRET }}
      ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI || secrets.ECR_REPOSITORY_URI }}
      VPC_ID: ${{ vars.VPC_ID || secrets.VPC_ID }}
      PUBLIC_SUBNET_A_ID: ${{ vars.PUBLIC_SUBNET_A_ID || secrets.PUBLIC_SUBNET_A_ID }}
      PUBLIC_SUBNET_B_ID: ${{ vars.PUBLIC_SUBNET_B_ID || secrets.PUBLIC_SUBNET_B_ID }}
      ENABLE_HTTPS: ${{ vars.ENABLE_HTTPS || secrets.ENABLE_HTTPS || 'true' }}
      API_DOMAIN_NAME: ${{ vars.API_DOMAIN_NAME || secrets.API_DOMAIN_NAME }}
      ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN || secrets.ACM_CERTIFICATE_ARN }}
      KBO_BACKEND_IMAGE_TAG: ${{ inputs.image_tag }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prepare push secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${FIREBASE_SERVICE_ACCOUNT_JSON_SECRET}" ]]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT_JSON" >&2
            exit 2
          fi
          if [[ -z "${IOS_GOOGLE_SERVICE_INFO_PLIST_SECRET}" ]]; then
            echo "Missing GitHub secret: IOS_GOOGLE_SERVICE_INFO_PLIST" >&2
            exit 2
          fi
          if [[ -z "${ANDROID_GOOGLE_SERVICES_JSON_SECRET}" ]]; then
            echo "Missing GitHub secret: ANDROID_GOOGLE_SERVICES_JSON" >&2
            exit 2
          fi
          if [[ -z "${APNS_AUTH_KEY_P8_SECRET}" ]]; then
            echo "Missing GitHub secret: APNS_AUTH_KEY_P8" >&2
            exit 2
          fi
          if [[ -z "${KBO_RELAY_USER_ID_SECRET}" ]]; then
            echo "Missing GitHub secret: KBO_RELAY_USER_ID" >&2
            exit 2
          fi
          if [[ -z "${KBO_RELAY_PASSWORD_SECRET}" ]]; then
            echo "Missing GitHub secret: KBO_RELAY_PASSWORD" >&2
            exit 2
          fi

          firebase_file="$RUNNER_TEMP/firebase-service-account.json"
          ios_firebase_file="$GITHUB_WORKSPACE/app/ios/Runner/GoogleService-Info.plist"
          android_firebase_file="$GITHUB_WORKSPACE/app/android/app/google-services.json"
          apns_file="$RUNNER_TEMP/apns-auth-key.p8"
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON_SECRET}" > "$firebase_file"
          printf '%s' "${IOS_GOOGLE_SERVICE_INFO_PLIST_SECRET}" > "$ios_firebase_file"
          printf '%s' "${ANDROID_GOOGLE_SERVICES_JSON_SECRET}" > "$android_firebase_file"
          printf '%s' "${APNS_AUTH_KEY_P8_SECRET}" > "$apns_file"

          python3 -m json.tool "$firebase_file" >/dev/null
          python3 -m json.tool "$android_firebase_file" >/dev/null
          python3 - "$ios_firebase_file" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as file:
              plistlib.load(file)
          PY
          grep -q "BEGIN PRIVATE KEY" "$apns_file"

          echo "FIREBASE_SERVICE_ACCOUNT_FILE=$firebase_file" >> "$GITHUB_ENV"
          echo "APNS_AUTH_KEY_FILE=$apns_file" >> "$GITHUB_ENV"
          echo "::add-mask::${KBO_RELAY_USER_ID_SECRET}"
          echo "::add-mask::${KBO_RELAY_PASSWORD_SECRET}"
          echo "KBO_RELAY_USER_ID=${KBO_RELAY_USER_ID_SECRET}" >> "$GITHUB_ENV"
          echo "KBO_RELAY_PASSWORD=${KBO_RELAY_PASSWORD_SECRET}" >> "$GITHUB_ENV"

          if [[ -n "${PUSH_SYNC_SECRET_INPUT}" ]]; then
            echo "::add-mask::${PUSH_SYNC_SECRET_INPUT}"
            echo "PUSH_SYNC_SECRET=${PUSH_SYNC_SECRET_INPUT}" >> "$GITHUB_ENV"
          else
            generated="$(openssl rand -hex 32)"
            echo "::add-mask::${generated}"
            echo "PUSH_SYNC_SECRET=${generated}" >> "$GITHUB_ENV"
          fi

      - name: Push / Live Activity preflight
        shell: bash
        run: ./scripts/push-live-preflight.sh --aws

      - name: Configure AWS credentials with OIDC
        if: ${{ inputs.dry_run == false && env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with access keys
        if: ${{ inputs.dry_run == false && env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID_SECRET }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY_SECRET }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Refresh push deploy role permissions
        if: ${{ inputs.dry_run == false && env.AWS_ROLE_TO_ASSUME != '' }}
        shell: bash
        run: |
          set -euo pipefail

          role_name="${AWS_ROLE_TO_ASSUME##*/}"
          patch_policy_name="${role_name}-push-demo-deploy-patch"
          aws iam put-role-policy \
            --role-name "$role_name" \
            --policy-name "$patch_policy_name" \
            --policy-document file://infra/aws/iam/github-actions-push-demo-permission-patch.json

      - name: Deploy push backend stack
        shell: bash
        run: |
          set -euo pipefail

          image_tag="${KBO_BACKEND_IMAGE_TAG}"
          if [[ "$image_tag" == "latest" ]]; then
            image_tag="${GITHUB_SHA::12}"
          fi

          args=(--tag "$image_tag")
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args=(--dry-run "${args[@]}")
          fi
          if [[ "${{ inputs.skip_readiness }}" == "true" ]]; then
            args=("${args[@]}" --skip-readiness)
          fi

          ./scripts/aws-push-demo-deploy.sh "${args[@]}"

      - name: Resubscribe registered push topics
        if: ${{ inputs.dry_run == false && inputs.resubscribe_topics == true }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f outputs/aws/cloudformation/stack.env ]]; then
            # shellcheck disable=SC1091
            source outputs/aws/cloudformation/stack.env
          fi

          base_url="${KBO_PUSH_STACK_API_BASE_URL:-${RELEASE_API_BASE_URL:-${API_BASE_URL:-}}}"
          if [[ -z "$base_url" ]]; then
            echo "Missing deployed API base URL for topic resubscribe." >&2
            exit 2
          fi
          if [[ -z "${PUSH_SYNC_SECRET:-}" ]]; then
            echo "Missing PUSH_SYNC_SECRET for topic resubscribe." >&2
            exit 2
          fi

          response_file="outputs/aws/push-topic-resubscribe.json"
          mkdir -p "$(dirname "$response_file")"
          curl -fsS \
            -X POST \
            -H "X-Kbo-Push-Sync-Secret: ${PUSH_SYNC_SECRET}" \
            "${base_url%/}/push/resubscribe-topics" \
            -o "$response_file"

          python3 - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              payload = json.load(file)

          data = payload.get("data") or {}
          print(
              "push_topic_resubscribe=status=ok "
              f"registeredDevices={data.get('registeredDevices')} "
              f"eligibleDevices={data.get('eligibleDevices')} "
              f"subscriptionsAttempted={data.get('subscriptionsAttempted')} "
              f"unsubscriptionsAttempted={data.get('unsubscriptionsAttempted')}"
          )
          if not payload.get("success"):
              raise SystemExit(1)
          PY

      - name: Print push backend diagnostics
        if: ${{ failure() && inputs.dry_run == false }}
        shell: bash
        run: |
          set -uo pipefail

          if [[ -f outputs/aws/cloudformation/stack.env ]]; then
            # shellcheck disable=SC1091
            source outputs/aws/cloudformation/stack.env
          fi

          cluster="${KBO_PUSH_STACK_CLUSTER_NAME:-kbo-fans}"
          api_service="${KBO_PUSH_STACK_API_SERVICE_NAME:-kbo-fans-api}"
          sync_service="${KBO_PUSH_STACK_SYNC_WORKER_SERVICE_NAME:-kbo-fans-sync-worker}"
          log_group="${KBO_PUSH_STACK_LOG_GROUP_NAME:-/ecs/kbo-fans-backend}"

          echo "::group::ECS service status"
          aws ecs describe-services \
            --cluster "$cluster" \
            --services "$api_service" "$sync_service" \
            --query 'services[].{serviceName:serviceName,status:status,runningCount:runningCount,pendingCount:pendingCount,desiredCount:desiredCount,events:events[0:5].message}' \
            --output json || true
          echo "::endgroup::"

          echo "::group::CloudWatch log streams"
          aws logs describe-log-streams \
            --log-group-name "$log_group" \
            --order-by LastEventTime \
            --descending \
            --max-items 10 \
            --query 'logStreams[].logStreamName' \
            --output text || true
          echo "::endgroup::"

          echo "::group::CloudWatch recent logs"
          aws logs tail "$log_group" --since 30m --format short || true
          echo "::endgroup::"

      - name: Upload deployment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-demo-deploy-outputs
          path: |
            outputs/aws/ecr/image.env
            outputs/aws/ecs-fargate/secrets.env
            outputs/aws/cloudformation/stack.env
            outputs/aws/push-topic-resubscribe.json
          if-no-files-found: ignore
          retention-days: 7
